# deploy/exedore/gha-images-warm runs hourly on Exedore as ghimages, and its
# journal was the only check. This runs its tests (scripts/gha-images-warm-test.sh,
# a stub podman against a temporary store) on every change; they need only bash
# and coreutils, so they run on the runner itself.

name: gha-images-warm tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: gha-images-warm tests
    # constitution#160's routing: same-repo, non-Dependabot pull requests on
    # our cached runner; push and manual runs on the uncached one; anything
    # else on GitHub's machines.
    runs-on: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (vars.CACHED_RUNNER_LABEL || 'ubuntu-latest')
          || contains(fromJSON('["push","workflow_dispatch"]'), github.event_name)
          && !startsWith(github.ref, 'refs/heads/dependabot/')
          && (vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest')
          || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gha-images-warm's prune, failure and permission branches
        run: bash scripts/gha-images-warm-test.sh
