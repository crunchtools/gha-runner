name: Build and Push Container Image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  # On a pull request this builds and smoke-tests WITHOUT publishing. Without
  # it, a change to this workflow could only be tested by merging it, and two
  # builds on main failed for exactly that reason.
  pull_request:
  repository_dispatch:
    types: [parent-image-updated]
  # Weekly, so Fedora's security updates reach the runner without anyone
  # remembering to push. The base is pinned by digest, so the update comes from
  # the Containerfile's `dnf -y upgrade`, which UPGRADE_STAMP forces past the
  # layer cache. A CI runner executes repository code; a stale
  # one is a liability, not merely out of date.
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
env:
  REGISTRY: quay.io
  IMAGE_NAME: crunchtools/gha-runner
  GHCR_IMAGE: ghcr.io/crunchtools/gha-runner

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      # Constitution: a successful BUILD proves almost nothing for this image.
      # The property that makes it usable is that a job can build AND run
      # containers inside it, and the build half works on bases where the run
      # half does not -- which is exactly how UBI 10 was eliminated. Load it
      # locally, assert both, and only then publish.
      - name: Build for the smoke test
        # podman, not buildx-into-docker. Nesting inside a docker container on
        # a GitHub runner needs that container privileged, and this image is
        # never deployed privileged, so a test that passes only with privileges
        # it will not have is not evidence. Handing a docker-built image over
        # with `docker save | podman load` also did not leave podman the name
        # the test then asked for, so it tried to pull from a registry called
        # "localhost". Building here with the engine the runner itself uses
        # removes both problems.
        run: podman build -t localhost/gha-runner:smoke -f Containerfile .

      - name: Smoke test -- nested build AND nested run
        env:
          ENGINE: podman
        run: ./scripts/smoke-test.sh localhost/gha-runner:smoke

      - name: Build and push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: UPGRADE_STAMP=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Language packages only. Trivy has no Fedora advisory source, so the OS
      # layer is not covered by this scan; `dnf -y upgrade` on every run is
      # that layer's control. A green result here says nothing about it.
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # The digest this run produced, not :latest -- a push to a
          # non-default branch tags by sha and never moves :latest, so :latest
          # would scan an older image and report it as this build's result.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same stamp as the quay job, so this mirror reuses the layers that
          # job just wrote instead of upgrading again and diverging from it.
          build-args: UPGRADE_STAMP=${{ github.run_id }}
          cache-from: type=gha
