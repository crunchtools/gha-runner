# Drop in as .github/workflows/constitution.yml. See constitution.md VII.
#
# The tag below is the constitution version this repo is judged by. It moves
# together with `Inherits:` in .specify/memory/constitution.md (scripts/fleet-bump.py
# opens that PR); Dependabot is told to ignore it, see examples/dependabot.yml.
# Required check: `Constitution / Validate constitution`.

name: Constitution

on:
  pull_request:
  push:
    branches: [main, master]

# A new push on a PR supersedes the run it interrupts. Only PR runs share a
# group; everything else keys on run_id, which is unique, so no non-PR run can
# be dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  constitution:
    name: Constitution
    uses: crunchtools/constitution/.github/workflows/validate.yml@v1.31.0
