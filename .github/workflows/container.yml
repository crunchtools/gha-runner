# The runner: a RHEL bootc VM image (Containerfile) that Exedore turns into a
# qcow2 and boots once per job (RT #1664). It replaced the rootless container
# image (1.1.x) in this same Quay repository.
#
# Gated like rhel10-bootc-server: a plain OCI manifest, then
# scripts/vm-smoke-test.sh (which runs `bootc container lint`) against the
# pushed digest.

name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # Weekly, so RHEL errata reach the runner without anyone remembering to
  # push: the Containerfile's `dnf update` runs fresh on every build.
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.51.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/gha-runner
      format: oci
      build-args: |
        UPGRADE_STAMP=${{ github.run_id }}-${{ github.run_attempt }}
      free-disk: true
      redhat-registry: true
      rhsm: true
      boot: command
      boot-command: bash scripts/vm-smoke-test.sh "$IMAGE"
      boot-timeout: 600
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      REGISTRY_REDHAT_IO_USER: ${{ secrets.REGISTRY_REDHAT_IO_USER }}
      REGISTRY_REDHAT_IO_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
      RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
      RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
