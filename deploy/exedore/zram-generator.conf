# Installed at /etc/systemd/zram-generator.conf on exedore (RT #1664). Swap in
# compressed RAM, ahead of the disk swap, so the runner VMs' memory overcommit
# turns a coincident peak into slowness instead of the OOM killer.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
