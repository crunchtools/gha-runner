[tool.sdlc]
repo-kinds = ["container-image"]
# The image is a RHEL bootc VM (Containerfile), built with RHSM secrets only
# the image job holds.

# The repo's own tests, which ran as three workflows before the fleet ci.yml.
[tool.sdlc.ci]
checks = ["deploy-units", "runner-prune", "images-warm", "vm-promote", "vm-disk", "grype-expiry"]
# The Containerfile needs RHSM secrets that `sdlc ci` is not given. The image
# job builds it with them and runs bootc-lint and container-scan on that build.
skip = ["container-build", "bootc-lint", "container-scan"]

# Both runner units pin the image by digest.
[tool.sdlc.ci.deploy-units]
kind = "command"
argv = ["bash", "scripts/deploy-units-test.sh"]

# gha-runner-prune's keep list, age and failure branches.
[tool.sdlc.ci.runner-prune]
kind = "command"
argv = ["bash", "scripts/gha-runner-prune-test.sh"]

# gha-images-warm's prune, failure and permission branches.
[tool.sdlc.ci.images-warm]
kind = "command"
argv = ["bash", "scripts/gha-images-warm-test.sh"]

# gha-runner-vm-promote takes a digest and nothing else. It needs flock, which
# the default check image lacks; this Debian image has util-linux.
[tool.sdlc.ci.vm-promote]
kind = "command"
image = "docker.io/library/python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"
argv = ["bash", "scripts/gha-runner-vm-promote-test.sh"]

# gha-runner-vm-disk binds bootc-image-builder's store from its work directory.
[tool.sdlc.ci.vm-disk]
kind = "command"
argv = ["bash", "scripts/gha-runner-vm-disk-test.sh"]

# No grype ignore past its EXPIRES date. PyYAML comes from PyPI, by hash.
[tool.sdlc.ci.grype-expiry]
kind = "command"
image = "docker.io/library/python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"
argv = ["bash", "scripts/grype-expiry-check.sh"]
network = true

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/gha-runner"
format = "oci"
free-disk = true
redhat-registry = true
rhsm = true
# NOT ENFORCED until crunchtools/sdlc#118: sdlc 0.15 accepts boot-command and
# prints it, but runs no shell in the job that holds the registry secrets. The
# image job's bootc-lint is what gates the image; scripts/vm-smoke-test.sh's
# runner, tool, unit and credential-guard assertions do not run in CI.
boot = "command"
boot-command = "bash scripts/vm-smoke-test.sh \"$IMAGE\""
boot-timeout = 600
